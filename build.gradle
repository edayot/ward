plugins {
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.8.0'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	splitEnvironmentSourceSets()

	mods {
		"ward" {
			sourceSet sourceSets.main
		}
	}

	accessWidenerPath = file("src/main/resources/ward.accesswidener")
}

checkstyle {
	configFile = rootProject.file('checkstyle.xml')
	toolVersion = '13.7.0'
}

spotless {
	lineEndings = com.diffplug.spotless.LineEnding.UNIX

	java {
		// Mechanical fixes only; layout is the developer's job, checked by checkstyle
		importOrder('java', 'javax', '', 'net.minecraft', 'dev.mcbookshelf')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
			"minecraft_version": inputs.properties.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}
